# Preserve Railway's edge-controlled public request metadata. Local/docker
# traffic lacks these headers, so fall back to nginx's own scheme/host.
map $http_x_forwarded_proto $public_forwarded_proto {
    https   https;
    http    http;
    wss     wss;
    ws      ws;
    default $scheme;
}

map $http_x_forwarded_host $public_original_host {
    default $http_x_forwarded_host;
    ""      $host;
}

# Railway's edge guarantees the first X-Forwarded-For entry is the real client
# even when the request passes through its CDN. X-Real-IP is deliberately not
# used: Railway documents that it can temporarily contain a CDN edge address.
# Collapse the edge-controlled chain to one value before forwarding to Uvicorn;
# local/docker traffic has no edge header and falls back to the direct peer.
map $http_x_forwarded_for $public_client_ip {
    ~^\s*(?<railway_client_ip>[^,\s]+) $railway_client_ip;
    default                           $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Phase 9.9: must match (or exceed) the backend MAX_UPLOAD_BYTES (6 MB) so
    # nginx doesn't 413 the request before it reaches FastAPI. Default is 1M
    # which silently blocked the avatar defensive-fallback path (when client-
    # side resize fails) and any direct API multipart upload above 1 MB.
    client_max_body_size 8m;

    # The official nginx image derives this from /etc/resolv.conf when
    # NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1. A variable proxy_pass below makes
    # nginx re-resolve Railway's private hostname after its short TTL instead
    # of pinning the backend IP until the frontend container restarts.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    resolver_timeout 5s;
    set $backend_upstream "${BACKEND_URL}";

    # Phase 63 (security): baseline security headers for everything nginx
    # serves directly (SPA shell + static assets). API/uploads responses
    # already get these from the backend's SecurityHeadersMiddleware, but
    # the SPA itself shipped with none. NOTE: nginx `add_header` is NOT
    # inherited into any location that declares its own add_header — the
    # static-assets block below repeats these alongside Cache-Control.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Content-Security-Policy (enforcing) — origins inventoried from frontend
    # source: pol.is embed (script + iframe + xhr), same-origin API/uploads/
    # websocket, no external fonts/CDNs. style-src 'unsafe-inline' is required
    # by React inline style attributes (script-src has NO unsafe-inline). The
    # Didit verification flow is a full-page redirect (no frame/connect from
    # our origin), so it needs no allowance. Report-Only stage QA swept every
    # load-bearing surface (incl. live pol.is embed + Didit redirect start)
    # with zero violations before this was flipped to enforcing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://pol.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://pol.is; font-src 'self'; connect-src 'self' https://pol.is wss://www.liquiddemocracy.us; frame-src https://pol.is; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'" always;

    # Phase 10.2: serve .webmanifest with the correct MIME so PWA install
    # affordances see application/manifest+json rather than nginx alpine's
    # default application/octet-stream. Browsers tolerate octet-stream via
    # sniffing, but the smoke check tests/smoke/test_proxy.py::test_manifest_mime_type
    # codifies the desired state. Exact-match location keeps the SPA fallback
    # below from trying to serve this URL through try_files.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend.
    # BACKEND_URL is substituted at container start via the nginx:alpine
    # template mechanism (see Dockerfile). The request-time variable is
    # load-bearing: it enables resolver-driven DNS refresh. Appending
    # $request_uri preserves the complete original path and query string.
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $public_original_host;
        proxy_set_header X-Real-IP $public_client_ip;
        proxy_set_header X-Forwarded-For $public_client_ip;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
    }

    # Proxy WebSocket connections
    location /ws/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $public_original_host;
        proxy_set_header X-Real-IP $public_client_ip;
        proxy_set_header X-Forwarded-For $public_client_ip;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
    }

    # Proxy uploaded avatars (Phase 9.8 W A2). The backend's StaticFiles mount
    # at /uploads/... serves resized JPEGs written by the avatar upload
    # endpoint. The ^~ modifier is REQUIRED — without it, the regex
    # location ~* \.(jpg|...)$ below would match first (regex always
    # overrides prefix unless prefix uses ^~) and nginx would try to serve
    # the .jpg from the SPA build directory.
    location ^~ /uploads/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $public_original_host;
        proxy_set_header X-Real-IP $public_client_ip;
        proxy_set_header X-Forwarded-For $public_client_ip;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeat server-level security headers — add_header in a location
        # suppresses inheritance of the server-level set (nginx semantics).
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
