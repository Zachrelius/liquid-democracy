server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Phase 9.9: must match (or exceed) the backend MAX_UPLOAD_BYTES (6 MB) so
    # nginx doesn't 413 the request before it reaches FastAPI. Default is 1M
    # which silently blocked the avatar defensive-fallback path (when client-
    # side resize fails) and any direct API multipart upload above 1 MB.
    client_max_body_size 8m;

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend.
    # BACKEND_URL is substituted at container start via the nginx:alpine
    # template mechanism (see Dockerfile). Defaults to docker-compose's service name.
    # Host -> $proxy_host so Railway's edge routes to the right upstream service
    # (not the frontend's own hostname). SNI is required for HTTPS upstreams
    # behind an edge that multiplexes by hostname.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Proxy WebSocket connections
    location /ws/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_ssl_server_name on;
    }

    # Proxy uploaded avatars (Phase 9.8 W A2). The backend's StaticFiles mount
    # at /uploads/... serves resized JPEGs written by the avatar upload
    # endpoint. The ^~ modifier is REQUIRED — without it, the regex
    # location ~* \.(jpg|...)$ below would match first (regex always
    # overrides prefix unless prefix uses ^~) and nginx would try to serve
    # the .jpg from the SPA build directory.
    location ^~ /uploads/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
